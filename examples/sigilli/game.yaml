game: sigilli

icons:
  fuoco: icons/fuoco.svg
  acqua: icons/acqua.svg
  terra: icons/terra.svg
  aria: icons/aria.svg

print:
  paper: a4
  margin: 5mm
  duplex-edge: long

components:
  - id: unit-card
    kind: card
    size: poker
    bleed: 3mm
    schema:
      required: [name, suit, cost, text]
      properties:
        name: { type: string, maxLength: 28 }
        suit: { enum: [fuoco, acqua, terra, aria] }
        cost: { type: integer, minimum: 0, maximum: 9 }
        text: { type: string, format: rich-text }
        flavor: { type: string, maxLength: 80 }
        art: { type: string, format: asset }
    faces:
      front: templates/card.typ
      back: templates/card.typ
    data: data/units.yaml
    print:
      sides: duplex
      crop-marks: true

  - id: seal
    kind: token
    shape: circle
    size: 25mm
    bleed: 2mm
    schema:
      required: [suit, name]
      properties:
        suit: { enum: [fuoco, acqua, terra, aria] }
        name: { type: string, maxLength: 12 }
    faces:
      front: templates/seal.typ
      back: templates/seal.typ
    data: data/seals.yaml
    print:
      sides: fold

  - id: vortex
    kind: token
    shape: hex
    size: 30mm
    orientation: pointy
    bleed: 2mm
    schema:
      required: [label]
      properties:
        label: { type: string }
    faces:
      front: templates/vortex.typ
    fields:
      qty: 6
      label: Vortice

  - id: dungeon-map
    kind: board
    size: { width: 500mm, height: 350mm }
    bleed: 3mm
    schema:
      required: [title]
      properties:
        title: { type: string }
        spaces:
          type: array
          items:
            type: object
            required: [at, terrain]
            properties:
              at: { format: grid-cell }
              terrain: { enum: [floor, lava, wall] }
    faces:
      front: templates/map.typ
    fields:
      title: Le Cripte
      spaces:
        - { at: [3, 4], terrain: lava }
        - { at: [4, 4], terrain: lava }
        - { at: [4, 5], terrain: lava }
        - { at: [8, 1], terrain: wall }
        - { at: [8, 2], terrain: wall }
        - { at: [8, 3], terrain: wall }
        - { at: [9, 3], terrain: wall }
        - { at: [12, 7], terrain: lava }
    grid: { type: hex, cols: 14, rows: 9, cell: vortex, origin: [25mm, 40mm] }
    print:
      mode: tiles
      overlap: 10mm
