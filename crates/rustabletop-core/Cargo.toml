[package]
name = "rustabletop-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core of rustabletop: validates tabletop game data against JSON Schema and renders cards, tokens and boards to print-and-play PDF and PNG through embedded Typst"
readme = "../../README.md"
keywords = ["tabletop", "boardgame", "print-and-play", "typst", "prototyping"]
categories = ["game-development", "rendering"]

[dependencies]
typst.workspace = true
typst-pdf.workspace = true
typst-render.workspace = true
typst-layout.workspace = true
typst-assets.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
saphyr = "0.3"
jsonschema = { version = "0.61", default-features = false }
csv = "1.4"
strsim = "0.11"
serde_path_to_error = "0.1"
imagesize = "0.14"
