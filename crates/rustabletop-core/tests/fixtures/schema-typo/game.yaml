game: fixture
components:
  - id: unit-card
    kind: card
    size: poker
    schema:
      required: [name, suit, cost]
      properties:
        name: { type: string }
        suit: { enumm: [fuoco, acqua, terra, aria] }
        cost: { type: integer, minimum: 0 }
    faces:
      front: face.typ
    data: data/units.yaml
