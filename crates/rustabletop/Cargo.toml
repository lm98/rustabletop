[package]
name = "rustabletop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent-first CLI that turns tabletop game data (YAML/CSV + JSON Schema + Typst templates) into print-and-play PDFs and PNGs for cards, tokens and boards"
readme = "../../README.md"
keywords = ["tabletop", "boardgame", "print-and-play", "typst", "cli"]
categories = ["command-line-utilities", "game-development", "rendering"]

[[bin]]
name = "rustabletop"
path = "src/main.rs"

[dependencies]
rustabletop-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
